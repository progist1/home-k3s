apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manyfold-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=manyfold"
    gethomepage.dev/name: "Manyfold"
    gethomepage.dev/group: "Фото и файлы"
    gethomepage.dev/icon: "mdi-cube-outline"
    gethomepage.dev/description: "🔐 3D-модели"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: stl.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: manyfold
                port:
                  number: 80
  tls:
    - hosts:
        - stl.home
      secretName: manyfold-internal-tls
