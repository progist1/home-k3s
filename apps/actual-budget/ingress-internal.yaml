apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual-budget-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=actual-budget"
    gethomepage.dev/name: "Actual Budget"
    gethomepage.dev/group: "Продуктивность"
    gethomepage.dev/icon: "actual-budget"
    gethomepage.dev/description: "🔑 финансы"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: money.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual-budget
                port:
                  number: 80
  tls:
    - hosts:
        - money.home
      secretName: actual-budget-internal-tls
