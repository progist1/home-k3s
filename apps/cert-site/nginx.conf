# Статика сайта (cert.progist.ru) и CORS-проба (probe.home) в одном nginx.
server {
  listen 8080 default_server;
  server_name cert.progist.ru _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  expires -1;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://probe.home https://lan.progist.ru; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location = /root-ca.crt {
    types { }
    default_type application/x-x509-ca-cert;
  }
  location = /root-ca.mobileconfig {
    types { }
    default_type application/x-apple-aspen-config;
  }

  location / { try_files $uri $uri/ =404; }
}

# Пробы: ответ 204 с CORS только для cert.progist.ru (в т.ч. Private Network Access).
#  probe.home       — сертификат root-CA (доверен только после установки)
#  lan.progist.ru   — публичный Let's Encrypt, A-запись на VIP: достижим только из LAN/VPN
server {
  listen 8080;
  server_name probe.home lan.progist.ru;
  server_tokens off;

  location = /ok {
    add_header Access-Control-Allow-Origin "https://cert.progist.ru" always;
    add_header Access-Control-Allow-Private-Network "true" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Max-Age "600" always;
    add_header Cache-Control "no-store" always;
    add_header Vary "Origin" always;
    return 204;
  }
  location / { return 404; }
}
