apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: apps
  labels:
    app.kubernetes.io/name: guacamole
    app.kubernetes.io/part-of: guacamole
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
        app.kubernetes.io/name: guacamole
        app.kubernetes.io/part-of: guacamole
    spec:
      enableServiceLinks: false
      containers:
        - name: guacamole
          image: guacamole/guacamole:1.6.0
          ports:
            - containerPort: 8080
          env:
            - name: GUACD_HOSTNAME
              value: guacd.apps.svc.cluster.local
            - name: GUACD_PORT
              value: "4822"
            - name: POSTGRESQL_HOSTNAME
              value: apps-pg-rw.apps.svc.cluster.local
            - name: POSTGRESQL_PORT
              value: "5432"
            - name: POSTGRESQL_DATABASE
              value: guacamole
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: guacamole-pg-creds
                  key: username
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: guacamole-pg-creds
                  key: password
            - name: OPENID_AUTHORIZATION_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: guacamole-secrets
                  key: openid-authorization-endpoint
            - name: OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: guacamole-secrets
                  key: openid-client-id
            - name: OPENID_ISSUER
              valueFrom:
                secretKeyRef:
                  name: guacamole-secrets
                  key: openid-issuer
            - name: OPENID_JWKS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: guacamole-secrets
                  key: openid-jwks-endpoint
            - name: OPENID_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: guacamole-secrets
                  key: openid-redirect-uri
            - name: REMOTE_IP_VALVE_ENABLED
              value: "true"
            - name: OPENID_ENABLED
              value: "true"
            - name: POSTGRESQL_ENABLED
              value: "true"
            - name: MYSQL_ENABLED
              value: "false"
            - name: EXTENSION_PRIORITY
              value: "openid"
          readinessProbe:
            httpGet:
              path: /guacamole/
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /guacamole/
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
