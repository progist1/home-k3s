apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: guacamole-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Guacamole"
    gethomepage.dev/group: "Доступ и админка"
    gethomepage.dev/icon: "guacamole"
    gethomepage.dev/description: "🔐 удалённые рабочие столы"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd,infra-guacamole-rewrite@kubernetescrd
spec:
  rules:
    - host: gua.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: guacamole
                port:
                  number: 8080
  tls:
    - hosts:
        - gua.home
      secretName: guacamole-internal-tls
