apiVersion: v1
kind: PersistentVolume
metadata:
  name: zigbee2mqtt-data-pv
spec:
  storageClassName: hostpath-manual
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /var/lib/zigbee2mqtt
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-yolki
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zigbee2mqtt-data-pvc
  namespace: apps
  labels:
    backup-level: edge-hostpath
spec:
  storageClassName: hostpath-manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: zigbee2mqtt-data-pv
