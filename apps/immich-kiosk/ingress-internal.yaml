apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-kiosk-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=immich-kiosk"
    gethomepage.dev/name: "Слайдшоу"
    gethomepage.dev/group: "Фото и файлы"
    gethomepage.dev/icon: "immich"
    gethomepage.dev/description: "🌐 фоторамка из Immich"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: kiosk.photos.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich-kiosk
                port:
                  number: 80
  tls:
    - hosts:
        - kiosk.photos.home
      secretName: immich-kiosk-internal-tls
