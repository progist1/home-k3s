apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelable-mcp
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: mcp.map.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homelable-mcp
                port:
                  number: 8001
  tls:
    - hosts:
        - mcp.map.home
      secretName: homelable-mcp-internal-tls
