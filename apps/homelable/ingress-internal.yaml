apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homelable-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Карта сети"
    gethomepage.dev/group: "Дом"
    gethomepage.dev/icon: "mdi-lan"
    gethomepage.dev/description: "🔑 устройства в сети"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: map.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homelable
                port:
                  number: 80
  tls:
    - hosts:
        - map.home
      secretName: homelable-internal-tls
