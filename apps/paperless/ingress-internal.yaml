apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=paperless"
    gethomepage.dev/name: "Paperless"
    gethomepage.dev/group: "Продуктивность"
    gethomepage.dev/icon: "paperless-ngx"
    gethomepage.dev/description: "🔐 документы"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: docs.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless
                port:
                  number: 80
  tls:
    - hosts:
        - docs.home
      secretName: paperless-internal-tls
