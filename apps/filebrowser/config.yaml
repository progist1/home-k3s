apiVersion: v1
kind: ConfigMap
metadata:
  name: filebrowser-config
  namespace: apps
data:
  config.yaml: |
    http:
      port: 80
      baseURL: "/"
      trustProxyHeaders: true
    server:
      logging:
        - levels: "info|error|warning"
      sources:
        - path: "/srv"
    auth:
      methods:
        password:
          enabled: true
          minLength: 8
          signup: false
        oidc:
          enabled: true
          clientId: bOmOYguxir5JSFouKDdIdaaQeThqvpnH8ruhgLgK
          issuerUrl: https://auth.progist.ru/application/o/filebrowser/
          scopes: openid email profile
          userIdentifier: preferred_username
          groupsClaim: groups
          adminGroup: filebrowser-admins
