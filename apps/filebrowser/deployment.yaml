apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
  namespace: apps
  labels:
    app.kubernetes.io/name: filebrowser
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
        app.kubernetes.io/name: filebrowser
    spec:
      containers:
        - name: filebrowser
          image: ghcr.io/gtsteffaniak/filebrowser:2.0.2-stable
          env:
            - name: FILEBROWSER_CONFIG
              value: /config/config.yaml
            - name: FILEBROWSER_DATABASE_PATH
              value: /database/filebrowser.sqlite
            - name: FILEBROWSER_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: filebrowser-oidc
                  key: FILEBROWSER_OIDC_CLIENT_SECRET
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /srv
            - name: config
              mountPath: /config
              readOnly: true
            - name: database
              mountPath: /database
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: filebrowser-data-pvc
        - name: config
          configMap:
            name: filebrowser-config
        - name: database
          persistentVolumeClaim:
            claimName: filebrowser-database-pvc
