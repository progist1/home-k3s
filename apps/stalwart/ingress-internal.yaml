apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalwart-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Stalwart"
    gethomepage.dev/group: "Почта"
    gethomepage.dev/icon: "mdi-server"
    gethomepage.dev/description: "🔑 почтовый сервер, админка"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: mail.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalwart
                port:
                  number: 8080
  tls:
    - hosts: [mail.home]
      secretName: stalwart-internal-tls
