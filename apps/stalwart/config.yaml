apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-config
  namespace: apps
  labels:
    app.kubernetes.io/name: stalwart
    app.kubernetes.io/part-of: home-cluster
    managed-by: flux
    environment: production
data:
  config.json: |
    {
      "storage": {
        "data": {
          "@type": "PostgreSql",
          "host": "apps-pg-rw.apps.svc.cluster.local",
          "port": 5432,
          "database": "stalwart",
          "authUsername": "stalwart",
          "authSecret": {
            "@type": "EnvironmentVariable",
            "variableName": "STALWART_DB_PASSWORD"
          }
        }
      }
    }
