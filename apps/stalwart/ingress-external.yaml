apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-external
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: infra-mail-chain@kubernetescrd
spec:
  rules:
    - host: mail.progist.ru
      http:
        paths:
          - { path: /jmap, pathType: Prefix, backend: { service: { name: stalwart, port: { number: 8080 } } } }
          - { path: /.well-known, pathType: Prefix, backend: { service: { name: stalwart, port: { number: 8080 } } } }
          - { path: /dav, pathType: Prefix, backend: { service: { name: stalwart, port: { number: 8080 } } } }
          - { path: /mail/config-v1.1.xml, pathType: Exact, backend: { service: { name: stalwart, port: { number: 8080 } } } }
          - { path: /autodiscover, pathType: Prefix, backend: { service: { name: stalwart, port: { number: 8080 } } } }
          - { path: /Autodiscover, pathType: Prefix, backend: { service: { name: stalwart, port: { number: 8080 } } } }
          # всё остальное: webmail
          - { path: /, pathType: Prefix, backend: { service: { name: bulwark, port: { number: 3000 } } } }
  tls:
    - hosts: [mail.progist.ru]
      secretName: mail-external-tls
