apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  namespace: apps
  labels:
    app.kubernetes.io/name: karakeep-chrome
    managed-by: flux
    app.kubernetes.io/part-of: home-cluster
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-chrome
  template:
    metadata:
      labels:
        app: karakeep-chrome
        app.kubernetes.io/name: karakeep-chrome
    spec:
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: k3s-prod
      containers:
        - name: chrome
          image: ghcr.io/karakeep-app/karakeep-chrome:156.0.8078.47-r1
          args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
            - --remote-debugging-address=0.0.0.0
            - --remote-debugging-port=9222
          ports:
            - name: cdp
              containerPort: 9222
          readinessProbe:
            tcpSocket:
              port: 9222
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "1Gi"
