apiVersion: v1
kind: Service
metadata:
  name: karakeep
  namespace: apps
spec:
  selector:
    app: karakeep
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-chrome
  namespace: apps
spec:
  selector:
    app: karakeep-chrome
  ports:
    - protocol: TCP
      port: 9222
      targetPort: 9222
---
apiVersion: v1
kind: Service
metadata:
  name: karakeep-meilisearch
  namespace: apps
spec:
  selector:
    app: karakeep-meilisearch
  ports:
    - protocol: TCP
      port: 7700
      targetPort: 7700
