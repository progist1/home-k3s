apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homebox-companion-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Homebox Companion"
    gethomepage.dev/group: "Дом"
    gethomepage.dev/icon: "homebox"
    gethomepage.dev/description: "🔑 добавление вещей по фото"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: companion.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homebox-companion
                port:
                  number: 80
  tls:
    - hosts:
        - companion.home
      secretName: companion-internal-tls
