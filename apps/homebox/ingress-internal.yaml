apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homebox-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=homebox"
    gethomepage.dev/name: "Homebox"
    gethomepage.dev/group: "Дом"
    gethomepage.dev/icon: "homebox"
    gethomepage.dev/description: "🔐 инвентарь дома"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: homebox.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homebox
                port:
                  number: 80
  tls:
    - hosts:
        - homebox.home
      secretName: homebox-internal-tls
