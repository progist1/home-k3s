apiVersion: apps/v1
kind: Deployment
metadata:
  name: homebox
  namespace: apps
  labels:
    app.kubernetes.io/name: homebox
    managed-by: flux
    app.kubernetes.io/part-of: home-cluster
    environment: production
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homebox
  template:
    metadata:
      labels:
        app: homebox
        app.kubernetes.io/name: homebox
    spec:
      enableServiceLinks: false
      containers:
        - name: homebox
          image: ghcr.io/sysadminsmedia/homebox:0.27.0
          ports:
            - name: http
              containerPort: 7745
          env:
            - name: HBOX_LOG_FORMAT
              value: json
            - name: HBOX_OPTIONS_ALLOW_ANALYTICS
              value: "false"
            - name: HBOX_OPTIONS_TRUST_PROXY
              value: "true"
            # регистрация открыта только до первого входа через SSO, потом закрыть
            - name: HBOX_OPTIONS_ALLOW_REGISTRATION
              value: "false"
            - name: HBOX_OPTIONS_ALLOW_LOCAL_LOGIN
              value: "false"
            - name: HBOX_DATABASE_DRIVER
              value: postgres
            - name: HBOX_DATABASE_HOST
              value: apps-pg-rw.apps.svc.cluster.local
            - name: HBOX_DATABASE_PORT
              value: "5432"
            - name: HBOX_DATABASE_DATABASE
              value: homebox
            - name: HBOX_DATABASE_SSL_MODE
              value: disable
            - name: HBOX_DATABASE_USERNAME
              valueFrom:
                secretKeyRef: { name: homebox-pg-creds, key: username }
            - name: HBOX_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: homebox-pg-creds, key: password }
            - name: HBOX_AUTH_API_KEY_PEPPER
              valueFrom:
                secretKeyRef: { name: homebox-secrets, key: api_key_pepper }
            - name: HBOX_OIDC_ENABLED
              value: "true"
            - name: HBOX_OIDC_ISSUER_URL
              value: "https://auth.progist.ru/application/o/homebox/"
            - name: HBOX_OIDC_SCOPE
              value: "openid profile email"
            - name: HBOX_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: homebox-secrets, key: client_id }
            - name: HBOX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: homebox-secrets, key: client_secret }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homebox-data-pvc
