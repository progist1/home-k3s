apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulwark
  namespace: apps
  labels:
    app: bulwark
    app.kubernetes.io/name: bulwark
    app.kubernetes.io/part-of: home-cluster
    managed-by: flux
    environment: production
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bulwark
  template:
    metadata:
      labels:
        app: bulwark
        app.kubernetes.io/name: bulwark
        app.kubernetes.io/part-of: home-cluster
    spec:
      containers:
        - name: bulwark
          image: ghcr.io/bulwarkmail/webmail:1.12.0
          env:
            - name: APP_NAME
              value: Почта
            - name: JMAP_SERVER_URL
              value: https://mail.progist.ru
          envFrom:
            - secretRef:
                name: bulwark-secrets
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - { name: data, mountPath: /app/data }
      volumes:
        - name: data
          emptyDir: {}
