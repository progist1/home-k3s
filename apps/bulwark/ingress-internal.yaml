apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bulwark-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=bulwark"
    gethomepage.dev/name: "Почта"
    gethomepage.dev/group: "Почта"
    gethomepage.dev/icon: "mdi-email-outline"
    gethomepage.dev/description: "🔑 веб-клиент"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: webmail.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bulwark
                port:
                  number: 3000
  tls:
    - hosts: [webmail.home]
      secretName: bulwark-internal-tls
