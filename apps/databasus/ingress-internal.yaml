apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: databasus-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=databasus"
    gethomepage.dev/name: "Databasus"
    gethomepage.dev/group: "Продуктивность"
    gethomepage.dev/icon: "mdi-database"
    gethomepage.dev/description: "🔑 клиент БД"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: databasus.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: databasus
                port:
                  number: 80
  tls:
    - hosts:
        - databasus.home
      secretName: databasus-internal-tls
