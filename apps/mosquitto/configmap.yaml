apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: apps
  annotations:
    reconcile.fluxcd.io/recreate: "true"
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    acl_file /mosquitto/auth/acl
    listener 1883
