apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portainer-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Portainer"
    gethomepage.dev/group: "Доступ и админка"
    gethomepage.dev/icon: "portainer"
    gethomepage.dev/description: "🔐 контейнеры"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
  - host: portainer.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: portainer
            port:
              number: 80
  tls:
  - hosts:
    - portainer.home
    secretName: portainer-internal-tls
