apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pvc-archiver-airtrail-uploads
  namespace: apps
spec:
  interval: 10m
  chart:
    spec:
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      chart: charts/pvc-archiver
  values:
    name: airtrail-uploads
    archiveName: airtrail-uploads
    sourcePVC: airtrail-uploads-pvc
    destPVC: backups-pvc
    schedule: "45 5 * * *"
    securityContext:
      fsGroup: 1000
      supplementalGroups: [1000]
