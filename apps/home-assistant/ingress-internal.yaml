apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=home-assistant"
    gethomepage.dev/name: "Home Assistant"
    gethomepage.dev/group: "Дом"
    gethomepage.dev/icon: "home-assistant"
    gethomepage.dev/description: "🔐 умный дом"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
  - host: ha.home
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: home-assistant
            port:
              number: 80
  tls:
  - hosts:
    - ha.home
    secretName: home-assistant-internal-tls
