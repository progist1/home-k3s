apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-config-local-pv
spec:
  storageClassName: hostpath-manual
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /var/lib/home-assistant
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-yolki
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-config-local-pvc
  namespace: apps
  labels:
    backup-level: edge-hostpath
spec:
  storageClassName: hostpath-manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: home-assistant-config-local-pv
