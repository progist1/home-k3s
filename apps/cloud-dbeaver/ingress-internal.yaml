apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-dbeaver-internal
  namespace: apps
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=cloud-dbeaver"
    gethomepage.dev/name: "DBeaver"
    gethomepage.dev/group: "Продуктивность"
    gethomepage.dev/icon: "dbeaver"
    gethomepage.dev/description: "🔑 клиент БД"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: db.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-dbeaver
                port:
                  number: 80
  tls:
    - hosts:
        - db.home
      secretName: cloud-dbeaver-internal-tls
