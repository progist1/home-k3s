apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: code-server-internal
  namespace: apps
  labels:
    managed-by: flux
    app.kubernetes.io/part-of: home-cluster
    environment: production
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: "app=code-server"
    gethomepage.dev/name: "VS Code"
    gethomepage.dev/group: "Продуктивность"
    gethomepage.dev/icon: "code-server"
    gethomepage.dev/description: "🔑 редактор в браузере"
    cert-manager.io/cluster-issuer: home-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-entry-point: websecure
    traefik.ingress.kubernetes.io/router.middlewares: infra-redirect-to-https@kubernetescrd
spec:
  rules:
    - host: code.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: code-server
                port:
                  number: 80
  tls:
    - hosts:
        - code.home
      secretName: code-server-internal-tls
