apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: net-backup-pvc
  namespace: apps
  annotations:
    k8up.io/backup: "true"
  labels:
    backup-level: important
    backup-offsite: "true"
spec:
  storageClassName: nfs-nvme-dynamic
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
