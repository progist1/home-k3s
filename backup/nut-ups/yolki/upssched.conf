# /etc/nut/upssched.conf на yolki
CMDSCRIPT /usr/local/sbin/upssched-cmd
PIPEFN /run/nut/upssched.pipe
LOCKFN /run/nut/upssched.lock

# Питание пропало: через 5 минут (300 с) объявляем FSD всем клиентам; вернулось раньше — отмена
AT ONBATT * START-TIMER fsd-timer 300
AT ONLINE * CANCEL-TIMER fsd-timer
# Страховка: UPS сам сообщил Low Battery — выключаемся сразу
AT LOWBATT * EXECUTE fsd-now
