apiVersion: v1
kind: Service
metadata:
  name: yolki-proxy
  namespace: infra
spec:
  selector:
    app: yolki-proxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: socks5
      port: 1080
      targetPort: socks5
      protocol: TCP
  type: ClusterIP
