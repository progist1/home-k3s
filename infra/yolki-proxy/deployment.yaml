apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolki-proxy
  namespace: infra
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolki-proxy
  template:
    metadata:
      labels:
        app: yolki-proxy
    spec:
      # The proxy must originate traffic from yolki itself, not from an overlay IP.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3s-yolki
      tolerations:
        - key: node.location.type
          operator: Equal
          value: remote
          effect: NoSchedule
        - key: node.role
          operator: Equal
          value: edge
          effect: NoSchedule
        - key: node.reliability
          operator: Equal
          value: low
          effect: NoSchedule
        - key: node.workload.class
          operator: Equal
          value: cctv
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gost
          image: gogost/gost:3.0.0
          args: ["-C", "/etc/gost/gost.yaml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: socks5
              containerPort: 1080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/gost/gost.yaml
              subPath: gost.yaml
              readOnly: true
            - name: auth
              mountPath: /etc/gost/auth
              subPath: auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: yolki-proxy-config
        - name: auth
          secret:
            secretName: yolki-proxy-auth
            defaultMode: 0400
