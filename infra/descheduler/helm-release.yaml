apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
  namespace: infra
spec:
  interval: 1h
  chart:
    spec:
      chart: descheduler
      version: "0.36.0"
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
  values:
    kind: CronJob
    schedule: "*/10 * * * *"
    priorityClassName: ""
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 1
    activeDeadlineSeconds: 120
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    deschedulerPolicy:
      profiles:
        - name: failed-pods
          pluginConfig:
            - name: DefaultEvictor
              args:
                podProtections:
                  defaultDisabled:
                    - "PodsWithLocalStorage"
            - name: RemoveFailedPods
              args:
                minPodLifetimeSeconds: 300
                excludeOwnerKinds:
                  - Job
                includingInitContainers: true
          plugins:
            deschedule:
              enabled:
                - RemoveFailedPods
