apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 1h
  chart:
    spec:
      chart: crowdsec
      version: "0.24.2"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    force: true
    remediation:
      retries: 3
  values:
    _collections: &collections >-
      crowdsecurity/traefik
      crowdsecurity/http-cve
      crowdsecurity/http-dos
      crowdsecurity/postfix
      crowdsecurity/dovecot
      crowdsecurity/wordpress
      crowdsecurity/nextcloud
      crowdsecurity/home-assistant
      crowdsecurity/whitelist-good-actors
      crowdsecurity/wireguard
      gauth-fr/immich
      firix/authentik
      Dominic-Wagner/vaultwarden
      andreasbrett/paperless-ngx
      LePresidente/jellyfin
      LePresidente/jellyseerr
      Jgigantino31/mealie
      corvese/apache-guacamole
      MrShippeR/filebrowser
      timokoessler/uptime-kuma

    image:
      tag: "v1.7.8"
    container_runtime: containerd

    lapi:
      nodeSelector:
        kubernetes.io/hostname: k3s-prod

      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
      persistentVolume:
        data:
          enabled: true
          storageClassName: nfs-nvme-dynamic
          accessModes:
            - ReadWriteOnce
          size: 1Gi
        config:
          enabled: true
          existingClaim: "crowdsec-config-pvc"
      extraInitContainers:
        - name: hub-setup
          image: crowdsecurity/crowdsec:v1.8.1
          env:
            - name: COLLECTIONS
              value: *collections
          command:
            - sh
            - -c
            - |
              ln -sf /etc/crowdsec_data /etc/crowdsec && \
              cscli hub update && \
              cscli collections install $COLLECTIONS && \
              cscli hub upgrade --force
          volumeMounts:
            - name: crowdsec-config
              mountPath: /etc/crowdsec_data
            - name: crowdsec-db
              mountPath: /var/lib/crowdsec/data
      env:
        - name: BOUNCER_KEY_traefik_bouncer
          valueFrom:
            secretKeyRef:
              name: crowdsec-vars
              key: crowdsec_bouncer_api_key
        - name: ENROLL_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-enroll-secret
              key: enroll-key
        - name: ENROLL_INSTANCE_NAME
          value: "k3s-home"
        - name: ENROLL_TAGS
          value: "k8s linux home"

    config:
      console.yaml: |
        share_manual_decisions: true
        share_tainted: true
        share_custom: true
        console_management: true
        share_context: true
      parsers:
        s00-raw: {}
        s01-parse:
          stalwart-auth.yaml: |
            name: custom/stalwart-auth
            description: "Stalwart auth.failed (SMTP submission / IMAP / HTTP): real client IP comes via PROXY protocol"
            filter: 'evt.Parsed.program == "stalwart"'
            onsuccess: next_stage
            nodes:
              - grok:
                  apply_on: message
                  pattern: '.*\(auth\.failed\) listenerId = "%{WORD:stalwart_listener}".*?remoteIp = %{IP:source_ip},'
                statics:
                  - meta: log_type
                    value: stalwart_auth_fail
                  - meta: source_ip
                    expression: evt.Parsed.source_ip
        s02-enrich:
          home-whitelist.yaml: |
            name: custom/home-whitelist
            description: "Whitelist static home IP"
            whitelist:
              reason: "Static home IP (progist)"
              ip:
                - "188.134.87.62"
      scenarios:
        stalwart-auth-bf.yaml: |
          type: leaky
          name: custom/stalwart-auth-bf
          description: "Brute force on Stalwart (submission / IMAP / HTTP): 5 auth failures in the leaky window"
          filter: "evt.Meta.log_type == 'stalwart_auth_fail'"
          leakspeed: "5m"
          capacity: 5
          groupby: "evt.Meta.source_ip"
          labels:
            service: stalwart
            type: brute_force
            remediation: true
          blackhole: 4h

    agent:
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "1500m"
          memory: "256Mi"
      tolerations:
        - key: node.hardware.gpu
          value: intel-igpu
          effect: NoSchedule
        - key: node.hardware.arch
          value: arm64
          effect: NoSchedule
      env:
        - name: COLLECTIONS
          value: *collections
      acquisition:
        # ── Ingress (k3s-prod) ──────────────────────────────────────────
        - namespace: kube-system
          podName: traefik-*
          program: traefik
        # ── Mail (k3s-prod) ─────────────────────────────────────────────
        # auth.failed пишется на уровне DEBUG: без него (трейсер Stalwart на info) парсер stalwart-auth ничего не увидит
        - namespace: apps
          podName: stalwart-*
          program: stalwart
        # ── Auth & access (k3s-prod) ─────────────────────────────────────
        - namespace: apps
          podName: authentik-server-*
          program: authentik
        # ── Apps on k3s-prod ─────────────────────────────────────────────
        - namespace: apps
          podName: home-assistant-*
          program: home-assistant
        - namespace: apps
          podName: nextcloud-*
          program: nextcloud
        - namespace: apps
          podName: vaultwarden-*
          program: vaultwarden
        - namespace: apps
          podName: paperless-*
          program: paperless-ngx
        - namespace: apps
          podName: mealie-*
          program: mealie
        - namespace: apps
          podName: filebrowser-*
          program: filebrowser
        - namespace: apps
          podName: guacamole-*
          program: apache-guacamole
        # ── Media (k3s-gpu — agent covers once toleration applied) ────────
        - namespace: apps
          podName: immich-server-*
          program: immich
        - namespace: apps
          podName: jellyfin-*
          program: jellyfin
        - namespace: apps
          podName: seerr-*
          program: jellyseerr
        # ── Monitoring (k3s-prod) ─────────────────────────────────────────
        - namespace: monitoring
          podName: uptime-kuma-*
          program: uptime-kuma
        # ── Apps on k3s-pi ───────────────────────────────────────────────
        - namespace: apps
          podName: memos-*
          program: memos
        - namespace: apps
          podName: vikunja-*
          program: vikunja
        - namespace: apps
          podName: wizarr-*
          program: wizarr
        # ── Apps without node pinning ─────────────────────────────────────
        - namespace: apps
          podName: actual-budget-*
          program: actual-budget
