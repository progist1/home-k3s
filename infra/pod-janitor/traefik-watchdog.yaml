# Traefik при старте скачивает плагин crowdsec-bouncer с GitHub. Если в этот момент нет DNS/сети (холодный старт ноды),
# он пишет "Plugins are disabled because an error has occurred" и до конца жизни пода остаётся без плагина:
# глобальный middleware crowdsec-bouncer становится невалидным, и ВСЕ маршруты websecure отдают 404, пока pod остаётся Ready.
# Watchdog находит такие pod'ы по логу и пересоздаёт их (к этому моменту сеть обычно уже работает).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-watchdog
  namespace: infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-watchdog
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-watchdog
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-watchdog
subjects:
  - kind: ServiceAccount
    name: traefik-watchdog
    namespace: infra
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: traefik-watchdog
  namespace: infra
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 90
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: traefik-watchdog
          restartPolicy: Never
          containers:
            - name: watchdog
              image: alpine/k8s:1.37.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  for pod in $(kubectl -n kube-system get pods -l app.kubernetes.io/name=traefik -o name); do
                    if kubectl -n kube-system logs "$pod" --tail=-1 2>/dev/null | grep -q "Plugins are disabled"; then
                      echo "$pod: плагины отключены (нет сети при старте), пересоздаю"
                      kubectl -n kube-system delete "$pod" --wait=false
                    fi
                  done
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop: ["ALL"]
