apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        hosts /etc/coredns/CustomHosts {
            fallthrough
        }
        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        prometheus :9153
        forward . 10.77.20.2 10.77.20.3 10.77.20.5
        cache 30
        loop
        reload
        loadbalance
    }
    import /etc/coredns/custom/*.server
  NodeHosts: |
    10.77.20.3 k3s-gpu
    10.77.20.5 k3s-pi
    10.77.20.2 k3s-prod
    10.77.20.6 k3s-yolki
  CustomHosts: |
    10.77.20.4 bigb.home
    10.77.20.6 vps.yolki
