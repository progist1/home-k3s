apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: parapar-pg-replica
  namespace: parapar-dr
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.11   # match prod exactly

  storage:
    size: 30Gi
    storageClass: zvol-local

  affinity:
    nodeSelector:
      node.storage.mount.postgres: "true"

  resources:
    requests:
      cpu: "100m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "768Mi"
  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "512MB"

  # bootstrap from the object store, then stay in continuous recovery
  bootstrap:
    recovery:
      source: parapar-prod
      # the exporter connects to this db; default "app" does not exist in a copy of prod
      database: parapar
      owner: parapar
  replica:
    enabled: true
    source: parapar-prod

  # stream from prod over WG; S3 archive stays as fallback
  externalClusters:
    - name: parapar-prod
      connectionParameters:
        host: 10.8.0.21
        port: "30432"
        user: dr_stream
        dbname: postgres
        sslmode: require
      password:
        name: dr-stream
        key: password
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: parapar-pg-source
          serverName: parapar-pg
