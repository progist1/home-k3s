# Static local PV on a ZFS zvol (block-backed FS on the node). CloudNativePG
# creates the PVC itself (it must own it — a pre-created PVC makes the operator
# log "no orphan PVCs found" and never start the instance). We only reserve the
# PV for the exact PVC name CNPG will use: <cluster>-1.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: parapar-pg-replica-pv
spec:
  storageClassName: zvol-local
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/zvols/postgres/parapar-dr
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: parapar-dr
    name: parapar-pg-replica-1
