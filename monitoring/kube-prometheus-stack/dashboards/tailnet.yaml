apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-tailnet
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "Infrastructure"
data:
  tailnet.json: |
    {
      "uid": "tailnet-servers",
      "title": "Tailnet и серверы",
      "tags": [
        "tailnet",
        "vps"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Серверы (up)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "count(up{job=\"external-nodes\",group=\"external-nodes\",host=~\"edge|msk-nuxt-1|dk-inferno-1|fi-inferno-1\"} == 1)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Серверы всего",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "count(up{job=\"external-nodes\",host=~\"edge|msk-nuxt-1|dk-inferno-1|fi-inferno-1\"})",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Пиров через DERP",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "count(max by (peer)(tailnet_peer_online{job=\"external-nodes\"}) == 1 and max by (peer)(tailnet_peer_direct{job=\"external-nodes\"}) == 0) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Пиров оффлайн",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none"
          },
          "targets": [
            {
              "expr": "count(max by (peer)(tailnet_peer_online{job=\"external-nodes\"}) == 0) or vector(0)",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Пиры tailnet (глазами серверов)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "online"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "offline",
                            "color": "red"
                          },
                          "1": {
                            "text": "online",
                            "color": "green"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "direct"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "DERP",
                            "color": "orange"
                          },
                          "1": {
                            "text": "direct",
                            "color": "green"
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true
          },
          "targets": [
            {
              "expr": "tailnet_peer_online{job=\"external-nodes\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "expr": "tailnet_peer_direct{job=\"external-nodes\"}",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "peer",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "instance 2": true,
                  "host 2": true,
                  "group": true,
                  "group 1": true,
                  "group 2": true,
                  "location": true,
                  "location 1": true,
                  "location 2": true,
                  "unstable": true,
                  "unstable 1": true,
                  "unstable 2": true,
                  "endpoint": true,
                  "endpoint 1": true,
                  "endpoint 2": true,
                  "service": true,
                  "service 1": true,
                  "service 2": true,
                  "namespace": true,
                  "namespace 1": true,
                  "namespace 2": true,
                  "pod": true,
                  "pod 1": true,
                  "pod 2": true,
                  "container": true,
                  "container 1": true,
                  "container 2": true
                },
                "renameByName": {
                  "Value #A": "online",
                  "Value #B": "direct",
                  "host 1": "наблюдатель",
                  "instance 1": "instance"
                }
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Трафик tailnet: принято (по серверам)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum by (host)(rate(tailnet_peer_rx_bytes{job=\"external-nodes\"}[5m]))",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Трафик tailnet: отправлено (по серверам)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "sum by (host)(rate(tailnet_peer_tx_bytes{job=\"external-nodes\"}[5m]))",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Трафик tailnet по парам (принято)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "rate(tailnet_peer_rx_bytes{job=\"external-nodes\"}[5m])",
              "legendFormat": "{{host}} ← {{peer}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "CPU, %",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 28,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "100 - avg by (host)(rate(node_cpu_seconds_total{job=\"external-nodes\",mode=\"idle\"}[5m])) * 100",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Память занято, %",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 28,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "100 * (1 - node_memory_MemAvailable_bytes{job=\"external-nodes\"} / node_memory_MemTotal_bytes{job=\"external-nodes\"})",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Диск / занято, %",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 28,
            "w": 8,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "100 * (1 - node_filesystem_avail_bytes{job=\"external-nodes\",mountpoint=\"/\"} / node_filesystem_size_bytes{job=\"external-nodes\",mountpoint=\"/\"})",
              "legendFormat": "{{host}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Возраст рукопожатия, с (по пирам)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 36,
            "w": 24,
            "h": 7
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "expr": "time() - tailnet_peer_last_handshake_timestamp_seconds{job=\"external-nodes\"}",
              "legendFormat": "{{host}} → {{peer}}",
              "refId": "A"
            }
          ]
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
