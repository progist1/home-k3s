apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: external-nodes
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: external-nodes
  scrapeInterval: 15s
  staticConfigs:
  - targets:
    - 'bigb.home:9134'  # zfs-exporter
    labels:
      group: 'external-nodes'
      host: 'home-truenas'
      location: 'home'
      exporter: 'zfs'
      hostname: bigb.home
  - targets:
    - 'bigb.home:9100'  # node-exporter
    labels:
      group: 'external-nodes' 
      host: 'home-truenas'
      location: 'home'
      exporter: 'node'
      hostname: bigb.home
  - targets:
    - 'vps.yolki:9100'
    labels:
      group: 'external-nodes'
      host: 'k3s-yolki'
      location: 'yolki'
  - targets:
    - 'vps.amsterdam:9100'
    labels:
      group: 'external-nodes'
      host: 'vpn-vps'
      location: 'amsterdam'
      unstable: 'true'
  # VPS в tailnet: node-exporter слушает только tailnet-адрес (scripts/vps-monitoring.sh), в kube-prometheus ходим с k3s-prod
  - targets:
    - 'edge.home:9100'
    labels:
      group: 'external-nodes'
      host: 'edge'
      location: 'spb-beget'
  - targets:
    - 'msk-nuxt-1.home:9100'
    labels:
      group: 'external-nodes'
      host: 'msk-nuxt-1'
      location: 'msk-nuxt'
  - targets:
    - 'dk-inferno-1.home:9100'
    labels:
      group: 'external-nodes'
      host: 'dk-inferno-1'
      location: 'dk-inferno'
      unstable: 'true'
  - targets:
    - 'fi-inferno-1.home:9100'
    labels:
      group: 'external-nodes'
      host: 'fi-inferno-1'
      location: 'fi-inferno'
