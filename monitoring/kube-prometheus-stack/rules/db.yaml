apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: database-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: postgres
    interval: 30s
    rules:
    - alert: PostgreSQLDown
      expr: |
        cnpg_collector_up{cluster="apps-pg"} == 0
        or absent(cnpg_collector_up{cluster="apps-pg"})
      for: 3m
      labels:
        severity: fatal
      annotations:
        summary: "База данных PostgreSQL (apps-pg) недоступна"
        description: "Метрики CNPG-кластера apps-pg не поступают или postgres не отвечает уже 3 минуты."

  - name: mysql
    interval: 30s
    rules:
    - alert: MySQLDown
      expr: up{job="mysql-exporter"} == 0
      for: 3m
      labels:
        severity: fatal
      annotations:
        summary: "База данных MySQL недоступна"
        description: "Метрики MySQL не поступают уже 3 минуты. Хост: {{ $labels.instance }}"

    - alert: MySQLReplicationLagCritical
      expr: |
        (
          mysql_slave_status_seconds_behind_source > 30
        )
        * on(instance) group_left
          mysql_version_info
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "MySQL replication lag CRITICAL on {{ $labels.host }}"
        description: |
          **Lag:** {{ $value }} seconds
          **Host:** {{ $labels.hostname }}
          **Master:** {{ $labels.master_host }}
          **Action:** 🚨 Replica is falling behind!

    - alert: MySQLReplicationLagWarning
      expr: |
        (
          mysql_slave_status_seconds_behind_source > 5
        )
        * on(instance) group_left
          mysql_version_info
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "MySQL replication lag warning on {{ $labels.host }}"
        description: |
          **Lag:** {{ $value }} seconds
          **Host:** {{ $labels.hostname }}
          **Action:** ⚠️ Monitor replication performance

    - alert: MysqlTooManyConnections(>80%)
      expr: max_over_time(mysql_global_status_threads_connected[1m]) / mysql_global_variables_max_connections * 100 > 80
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: MySQL too many connections (> 80%) (instance {{ $labels.instance }})
        description: "More than 80% of MySQL connections are in use on {{ $labels.instance }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - alert: MysqlHighThreadsRunning
      expr: max_over_time(mysql_global_status_threads_running[1m]) / mysql_global_variables_max_connections * 100 > 60
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: MySQL high threads running (instance {{ $labels.instance }})
        description: "More than 60% of MySQL connections are in running state on {{ $labels.instance }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - alert: MysqlSlaveIoThreadNotRunning
      expr: ( mysql_slave_status_replica_io_running and ON (instance) mysql_slave_status_source_server_id > 0 ) == 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: MySQL Slave IO thread not running (instance {{ $labels.instance }})
        description: "MySQL Slave IO thread not running on {{ $labels.instance }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - alert: MysqlSlaveSqlThreadNotRunning
      expr: ( mysql_slave_status_replica_sql_running and ON (instance) mysql_slave_status_source_server_id > 0) == 0
      for: 0m
      labels:
        severity: critical
      annotations:
        summary: MySQL Slave SQL thread not running (instance {{ $labels.instance }})
        description: "MySQL Slave SQL thread not running on {{ $labels.instance }}\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - alert: MysqlRestarted
      expr: mysql_global_status_uptime < 180
      for: 0m
      labels:
        severity: info
      annotations:
        summary: MySQL restarted (instance {{ $labels.instance }})
        description: "MySQL has just been restarted, less than 3 minutes ago on {{ $labels.instance }}.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
    - alert: MysqlHighQps
      expr: irate(mysql_global_status_questions[1m]) > 5000
      for: 2m
      labels:
        severity: info
      annotations:
        summary: MySQL High QPS (instance {{ $labels.instance }})
        description: "MySQL is being overload with unusual QPS (> 10k QPS).\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"



  - name: redis
    interval: 30s
    rules:
    - alert: RedisDown
      expr: up{job="redis-exporter"} == 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "Redis DOWN on {{ $labels.host }}"
        description: "Cannot scrape Redis metrics."
