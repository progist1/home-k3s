apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mail-rules
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: mail
    rules:
    - alert: MailRoundtripFailed
      expr: mail_roundtrip_success{job="mailtest"} == 0
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Mail delivery test failed"
        description: "Test email was sent but not found in INBOX within 90s. Mail stack may be broken."

    - alert: MailRoundtripStale
      expr: absent(mail_roundtrip_success{job="mailtest"})
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "Mail round-trip test not reporting"
        description: "No mail_roundtrip_success metric for 15m — mailtest CronJob may be failing."

    - alert: StalwartDown
      expr: kube_deployment_status_replicas_available{namespace="apps",deployment="stalwart"} == 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "Stalwart mail server is down"
        description: "No available replicas of the stalwart deployment for 3 minutes: mail is neither received nor sent."
