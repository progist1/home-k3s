image: alpine:3.20

default:
  tags:
    - k8s

stages:
  - validate
  - deploy

validate-manifests:
  stage: validate
  script:
    - set -eu
    - apk add --no-cache bash curl
    # kubeconform
    - curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
    - tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
    - chmod +x /usr/local/bin/kubeconform
    # kubectl (includes `kubectl kustomize`)
    - curl -fsSL -o /usr/local/bin/kubectl https://dl.k8s.io/release/v1.33.6/bin/linux/amd64/kubectl
    - chmod +x /usr/local/bin/kubectl
    - kubectl version --client=true
    - kubeconform -v
    - |
      validate() {
        name="$1"
        path="$2"
        echo ""
        echo "==> ${name}: ${path}"
        kubectl kustomize "${path}" | kubeconform \
          -strict \
          -ignore-missing-schemas \
          -summary \
          -kubernetes-version 1.33.0
      }
      validate "clusters/home" "./clusters/home"
      validate "namespaces" "./namespaces"
      validate "helm" "./helm"
      validate "infra" "./infra"
      validate "apps" "./apps"
      validate "monitoring" "./monitoring"
      validate "sealed-secrets" "./sealed-secrets"
      validate "gitlab" "./gitlab"

# --- Edge VPS (infra/edge): не Flux, а ansible + compose по SSH ---------------------------------

validate-edge:
  stage: validate
  rules:
    - changes:
        - infra/edge/**/*
  script:
    - set -eu
    - apk add --no-cache ansible-core docker-cli docker-cli-compose
    - cd infra/edge/ansible
    - ansible-galaxy collection install -r requirements.yml
    - ansible-playbook site.yml --syntax-check
    # compose требует существования env_file; в CI подставляем пустышку (настоящий токен живёт только на VPS)
    - mkdir -p /opt/edge/secrets && echo "FRP_TOKEN=ci" > /opt/edge/secrets/frps.env && echo "TS_AUTHKEY=ci" > /opt/edge/secrets/tailscale.env && echo "SMTPD_SASL_USERS=relay@progist.ru:ci" > /opt/edge/secrets/smtp-relay.env
    - docker compose -f ../compose/edge-core/compose.yaml config -q

# Инертен, пока не задана защищённая переменная EDGE_DEPLOY_SSH_KEY (type: File, protected, masked недоступен для File).
# EDGE_SSH_KNOWN_HOSTS: вывод `ssh-keyscan -t ed25519 edge.progist.ru` (пин ключа хоста).
deploy-edge:
  stage: deploy
  resource_group: edge-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $EDGE_DEPLOY_SSH_KEY'
      changes:
        - infra/edge/**/*
  script:
    - set -eu
    - apk add --no-cache ansible-core openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$EDGE_DEPLOY_SSH_KEY" ~/.ssh/edge && chmod 600 ~/.ssh/edge
    - printf '%s\n' "$EDGE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - cd infra/edge/ansible
    - ansible-galaxy collection install -r requirements.yml
    - ANSIBLE_PRIVATE_KEY_FILE=~/.ssh/edge ansible-playbook site.yml --tags edge_core -e ansible_user=deploy --diff
