# DinD runner: только джобы с tags: [docker] или [dind].
# limit/concurrent = 3 — до одного dockerd на prod/gpu/yolki; вместе с k8s-runner (5) = 8 слотов.
# Topology spread (ci-job) раскидывает по hostname; тяжёлый джоб упрётся в memory_limit
# контейнера (OOMKilled), а не в kernel OOM ноды — при условии, что лимиты соблюдены.
#
# /builds и /var/lib/docker — tmpfs (sizeLimit 8Gi каждый). Usage считается в memory
# cgroup контейнера-писателя → при (process + tmpfs) > memory_limit будет OOMKilled,
# а не только Evicted по sizeLimit. Лимиты build/service раздельные.
gitlabUrl: http://gitlab.gitlab.svc.cluster.local

concurrent: 3

rbac:
  create: true

runners:
  secret: gitlab-runner-secrets
  config: |
    [[runners]]
      name = "k3s-dind"
      limit = 3

      executor = "kubernetes"
      builds_dir = "/builds"
      tls-ca-file = "/etc/docker/certs.d/registry.gitlab.home/ca.crt"

      environment = [
        "FF_USE_ADVANCED_POD_SPEC_CONFIGURATION=true",
        "DOCKER_TLS_CERTDIR=",
        "DOCKER_HOST=tcp://docker:2375",
        "GIT_SSL_CAINFO=/etc/docker/certs.d/registry.gitlab.home/ca.crt"
      ]

      [runners.kubernetes]
        namespace = "gitlab-runner"
        privileged = true
        image = "docker:27.5.1"
        poll_timeout = 600
        # Джоб может дописать селектор, напр.:
        #   KUBERNETES_NODE_SELECTOR_LOC=node.location.type=local  → prod+gpu
        #   KUBERNETES_NODE_SELECTOR_NODE=kubernetes.io/hostname=k3s-gpu
        node_selector_overwrite_allowed = "(kubernetes\\.io/hostname|node\\.location\\.type)=.*"

        memory_request = "2Gi"
        memory_limit = "12Gi"
        service_memory_request = "2Gi"
        service_memory_limit = "12Gi"
        helper_memory_request = "128Mi"
        helper_memory_limit = "512Mi"

        [runners.kubernetes.pod_labels]
          "ci-job" = "true"
          "ci-runner" = "dind"

        [runners.kubernetes.node_selector]
          "ci-runner" = "true"
          "kubernetes.io/arch" = "amd64"

        [runners.kubernetes.node_tolerations]
          "node.hardware.gpu=intel-igpu" = "NoSchedule"
          "node.location.type=remote" = "NoSchedule"
          "node.role=edge" = "NoSchedule"
          "node.reliability=low" = "NoSchedule"
          "node.workload.class=cctv" = "NoSchedule"

        [[runners.kubernetes.pod_spec]]
          name = "topology-spread"
          patch_type = "strategic"
          patch = """
            topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  ci-job: "true"
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      ci-runner: dind
                  topologyKey: kubernetes.io/hostname
            """

        [[runners.kubernetes.volumes.config_map]]
          name = "home-root-ca"
          mount_path = "/etc/docker/certs.d/registry.gitlab.home"

        [[runners.kubernetes.volumes.empty_dir]]
          name = "builds"
          mount_path = "/builds"
          medium = "Memory"
          size_limit = "8Gi"

        [[runners.kubernetes.volumes.empty_dir]]
          name = "docker"
          mount_path = "/var/lib/docker"
          medium = "Memory"
          size_limit = "8Gi"

        [[runners.kubernetes.services]]
          name = "docker:27.5.1-dind"
          alias = "docker"
          command = ["dockerd", "--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false"]

resources:
  requests:
    cpu: "50m"
    memory: "128Mi"
  limits:
    cpu: "250m"
    memory: "256Mi"
