apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-staging-ci
  namespace: lab-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-staging-ci-admin
  namespace: lab-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: lab-staging-ci
    namespace: lab-staging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-staging-ci-admin
  namespace: lab-load
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: lab-staging-ci
    namespace: lab-staging
---
# Namespace objects are cluster-scoped; RoleBinding admin cannot delete them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-staging-ci-namespaces
rules:
  # Informers use list/watch at cluster scope; resourceNames does not apply to list/watch.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  # create cannot be limited by resourceNames.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames:
      - lab-staging
      - lab-load
    verbs: ["get", "update", "patch", "delete"]
  # admin RoleBinding does not allow write to quotas; RoleBindings also vanish
  # when CI recreates the NS in the same apply, so these must be cluster-scoped.
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-staging-ci-namespaces
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-staging-ci-namespaces
subjects:
  - kind: ServiceAccount
    name: lab-staging-ci
    namespace: lab-staging
