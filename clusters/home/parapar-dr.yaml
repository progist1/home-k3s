apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: parapar-dr
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  path: ../../parapar-dr
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: cloudnative-pg
    - name: sealed-secrets
    - name: namespaces
